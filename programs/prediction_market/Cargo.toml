[package]
name = "prediction_market"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "prediction_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
]


[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"]}
anchor-spl = "1.2.1"
fixed = "=1.28.0"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-secp256k1-recover = "3.3.0"
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }


[dev-dependencies]
litesvm = "0.10.0"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
solana-account = "3.2"
solana-address = "2"
solana-clock = "3"
solana-compute-budget-interface = "3"
solana-instruction = "3"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-program-pack = "3"
solana-signer = "3.0.0"
solana-system-interface = { version = "2", features = ["bincode"] }
solana-transaction = "3.0.2"
spl-associated-token-account-interface = "2"
spl-token-interface = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

